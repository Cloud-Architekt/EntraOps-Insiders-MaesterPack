name: Sync from EntraOps

# Generates the pack from an EntraOps tag or commit (Build-EntraOpsMaesterPack.ps1), points its links to this
# repository, opens a pull request with the changes and starts the checks on it.
#
# The EntraOps repository is Cloud-Architekt/EntraOps unless the Actions variable ENTRAOPS_REPOSITORY names
# another one. A private one (the Insiders repository) needs the secret ENTRAOPS_TOKEN: a fine-grained token
# with read access to its contents.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The EntraOps tag, branch or commit to generate the pack from
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-from-entraops
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENTRAOPS_REPOSITORY: ${{ vars.ENTRAOPS_REPOSITORY || 'Cloud-Architekt/EntraOps' }}
      PACK_REPOSITORY_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Check out the pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pack

      - name: Check out EntraOps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.ENTRAOPS_REPOSITORY }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ENTRAOPS_TOKEN || github.token }}
          path: entraops
          persist-credentials: false

      - name: Generate the pack
        shell: pwsh
        working-directory: pack
        run: |
          ../entraops/Integrations/Maester/Build-EntraOpsMaesterPack.ps1 -OutputPath .
          # The build writes the links of the published repository.
          . ./tools/Set-EntraOpsPackRepository.ps1
          Set-EntraOpsPackRepository -Name $env:PACK_REPOSITORY_NAME | Format-Table -AutoSize | Out-String | Write-Host

      - name: Open a pull request and check it
        shell: pwsh
        working-directory: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (git status --porcelain)) {
              Write-Host 'The pack is up to date with EntraOps.'
              exit 0
          }
          $source = Get-Content -LiteralPath entraops-source.json -Raw | ConvertFrom-Json
          $short = "$($source.Commit)".Substring(0, 7)
          $branch = "sync/entraops-$($source.Version)-$short"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create $branch
          git add --all
          git commit --message "Sync from EntraOps $($source.Version) ($short)"
          git push --force origin $branch

          if (-not (gh pr list --head $branch --state open --json number --jq '.[].number')) {
              $body = @(
                  "Generated by Build-EntraOpsMaesterPack.ps1 from $($source.Repository) at $($source.Commit) (EntraOps $($source.Version), $($source.Rules) rules)."
                  ''
                  "Before merging, add the changes to the section ``## $($source.Version)`` of CHANGELOG.md, and to TESTS.md when the tests changed. **Release** publishes the version after the merge."
              ) -join "`n"
              $body | Set-Content -LiteralPath "$env:RUNNER_TEMP/sync-body.md"
              gh pr create --base main --head $branch --title "Sync from EntraOps $($source.Version) ($short)" --body-file "$env:RUNNER_TEMP/sync-body.md"
          }
          # A pull request opened with the workflow token starts no workflow: start the checks on its branch.
          gh workflow run check-pack.yml --ref $branch
