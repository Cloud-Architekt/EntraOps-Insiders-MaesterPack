name: Release

# Checks every push to main and, once the Actions variable PACK_RELEASES is true, releases the version of the
# pack when it has no release yet: tags the commit v<Version> and publishes the release with the section of the
# version in CHANGELOG.md as its notes. The repository is private: Install-MtPack and Restore-MtPack read the
# release only with a token that can read this repository (GH_TOKEN), so only people with access install the pack.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check-pack.yml

  release:
    needs: check
    if: vars.PACK_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Release the version of the pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = Get-Content -LiteralPath maester-pack.json -Raw | ConvertFrom-Json
          $source = Get-Content -LiteralPath entraops-source.json -Raw | ConvertFrom-Json
          $version = $manifest.Version
          $tag = "v$version"

          if (@(gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName --jq '.[].tagName') -contains $tag) {
              Write-Host "$tag is released already."
              exit 0
          }
          if (gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == `"refs/tags/$tag`") | .ref") {
              throw "The tag $tag exists without a release. Remove it or publish its release by hand."
          }
          if ($source.Version -ne $version) { throw "entraops-source.json has the version $($source.Version), maester-pack.json $version. Run Sync from EntraOps." }
          if ($source.LocalChanges -ne $false) { throw "The pack was generated from local EntraOps changes (LocalChanges in entraops-source.json). Run Sync from EntraOps for an EntraOps tag or commit." }
          if ($manifest.Homepage -ne "https://github.com/$env:GITHUB_REPOSITORY") { throw "The links of the pack point to $($manifest.Homepage), not to this repository. Run Set-EntraOpsPackRepository (tools/)." }

          # The repository is private: only people with access to it can install the pack and open its links. The
          # links into this repository (the Docs button of every test) must name a file of this commit; GitHub
          # answers 404 to anyone without access, so they are not requested. The other links (the EntraOps rule
          # catalog and documentation) open once EntraOps publishes this version, so they only warn.
          $repositoryUrl = "https://github.com/$env:GITHUB_REPOSITORY"
          $links = @(
              Get-ChildItem -LiteralPath tests -Filter '*.md' | Get-Content -Raw | ForEach-Object { [regex]::Matches($_, '\]\((https://[^)\s]+)\)') | ForEach-Object { $_.Groups[1].Value } }
              Get-ChildItem -LiteralPath tests -Filter '*.ps1' | Get-Content -Raw | ForEach-Object { [regex]::Matches($_, "HelpUrl\s*=\s*'(https://[^']+)'") | ForEach-Object { $_.Groups[1].Value } }
              $manifest.Homepage, $manifest.Support, $manifest.SecurityContact
          ) | Where-Object { $_ } | ForEach-Object { ($_ -split '#')[0] } | Sort-Object -Unique
          $missing = @(foreach ($link in $links) {
              if (-not $link.StartsWith("$repositoryUrl/", [System.StringComparison]::OrdinalIgnoreCase) -and $link -ne $repositoryUrl) { continue }
              $file = [regex]::Match($link, '^https://github\.com/[^/]+/[^/]+/blob/[^/]+/(.+)$')
              if ($file.Success -and -not (Test-Path -LiteralPath ([uri]::UnescapeDataString($file.Groups[1].Value)) -PathType Leaf)) { $link }
          })
          if ($missing.Count) { throw "These links of the pack name files that this commit does not have: $($missing -join ', ')." }
          foreach ($link in @($links | Where-Object { -not $_.StartsWith($repositoryUrl, [System.StringComparison]::OrdinalIgnoreCase) })) {
              $status = 0
              foreach ($attempt in 1..3) {
                  try { $status = [int](Invoke-WebRequest -Uri $link -Method Get -MaximumRedirection 5 -TimeoutSec 30 -SkipHttpErrorCheck -UserAgent 'Mozilla/5.0 (EntraOps Maester Pack release check)').StatusCode } catch { $status = 0 }
                  # Only an answer that can change is asked again (no answer, too many requests, a server error).
                  if ($status -ne 0 -and $status -ne 429 -and $status -lt 500) { break }
                  Start-Sleep -Seconds (5 * $attempt)
              }
              if ($status -ne 200) { Write-Warning "The link $link answered $status. It opens once EntraOps publishes this version." }
          }
          # The sections that the tests link in the EntraOps documentation, which renders them from data/content.js.
          $docs = try { (Invoke-WebRequest -Uri 'https://www.entraops.com/docs/data/content.js' -TimeoutSec 30).Content } catch { '' }
          foreach ($anchor in 'findings', 'finding-exceptions') {
              if ($docs -notmatch "\{#$anchor\}") { Write-Warning "The EntraOps documentation has no section '#$anchor' yet (https://www.entraops.com/docs/reportings/index.html): the links of the tests to it open once the documentation of this EntraOps version is published." }
          }

          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, '(?ms)^## ' + [regex]::Escape($version) + '\s*$\r?\n(.*?)(?=^## |\z)')
          if (-not $section.Success -or [string]::IsNullOrWhiteSpace($section.Groups[1].Value)) { throw "CHANGELOG.md has no section '## $version' with the changes." }
          $section.Groups[1].Value.Trim() | Set-Content -LiteralPath "$env:RUNNER_TEMP/release-notes.md"

          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "EntraOps Maester Pack $version" --notes-file "$env:RUNNER_TEMP/release-notes.md"
