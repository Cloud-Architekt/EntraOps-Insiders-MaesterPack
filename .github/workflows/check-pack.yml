name: Check pack

# The checks of the pack (ci/PackChecks.ps1) without a tenant connection. Pull requests run them here; pushes to
# main run them through Release, and Sync from EntraOps starts them on its pull request (workflow_dispatch),
# because a pull request opened with the workflow token starts no workflow.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # The checks always use the newest Maester of the PowerShell Gallery, prereleases included, so the pack is checked
  # against the version users install. The Pester version is pinned; Dependabot doesn't update PowerShell modules:
  # raise it here.
  PESTER_VERSION: 6.2.0

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Maester and Pester
        shell: pwsh
        run: |
          Install-PSResource -Name Maester -Prerelease -Repository PSGallery -TrustRepository -Scope CurrentUser
          $maester = Get-InstalledPSResource -Name Maester -Scope CurrentUser | Sort-Object Version -Descending | Select-Object -First 1
          $maesterVersion = "$($maester.Version)$(if ($maester.Prerelease) { "-$($maester.Prerelease)" })"
          Write-Host "Checking with Maester $maesterVersion"
          "### Checked with Maester $maesterVersion" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Install-PSResource -Name Pester -Version $env:PESTER_VERSION -Repository PSGallery -TrustRepository -Scope CurrentUser

      - name: Check the pack
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $configuration = New-PesterConfiguration
          $configuration.Run.Container = New-PesterContainer -ScriptBlock { . ./ci/PackChecks.ps1; Invoke-EntraOpsPackCheck }
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.Output.CIFormat = 'GithubActions'
          Invoke-Pester -Configuration $configuration
